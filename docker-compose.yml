services:
  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.3.0
    ports:
      - "8888:8888" # Jupyter
      - "4040:4040" # Spark UI
    volumes:
      - ./:/home/jovyan/work # Project folder is available as work/ inside the container
    env_file:
      - .env # makes POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB available to the notebook via os.environ
    depends_on:
      - kafka
      - postgres

  kafka:
    image: apache/kafka:latest # pin a specific version tag when sharing
    ports:
      - "9094:9094" # access from Windows: localhost:9094 (notebook uses kafka:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16
    restart: unless-stopped
    shm_size: 128mb # more shared memory than Docker's 64 MB default, for larger queries
    ports:
      - "5432:5432" # access from Windows: localhost:5432 (notebook uses postgres:5432)
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # values come from the .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data # keeps database data between restarts

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080" # web UI: http://localhost:8080 (server: postgres)
    depends_on:
      - postgres

volumes:
  pgdata:
